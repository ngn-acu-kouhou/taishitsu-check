<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="長野県針灸師会の鍼灸体験会（看護研究学会）にご参加いただいた方へのアンケートです。" />
    <meta name="robots" content="noindex" />
    <title>体験アンケート | 鍼灸体験会（看護研究学会）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../themes/b-botanical.css?v=20261015-1" />
    <link rel="stylesheet" href="survey.css?v=20261015-3" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">EXPERIENCE SURVEY</p>
        <h1 id="page-title">体験アンケート</h1>
        <p>ご体験ありがとうございました。<br />医療機関と鍼灸師の連携づくりに活かします。3分ほどで終わります。</p>
      </section>

      <div class="progress" aria-hidden="true">
        <div class="progress-bar"><span id="progress-fill"></span></div>
        <p class="progress-text"><span id="progress-now">1</span> / <span id="progress-total">6</span></p>
      </div>

      <form id="survey-form" novalidate>
        <div id="steps"></div>
        <p id="validation-message" class="validation-message" role="alert" hidden></p>
        <div class="actions">
          <button class="reset-button" type="button" id="prev-button" hidden>もどる</button>
          <button class="judge-button" type="button" id="next-button">はじめる</button>
        </div>
      </form>

      <section id="done" class="result" aria-live="polite" hidden></section>

      <aside class="medical-note" id="privacy-note">
        <h3>お答えいただく内容について</h3>
        <p>回答は匿名で集計し、体験会の改善と、医療機関と鍼灸師の連携づくり・鍼灸の広報活動にのみ使用します。お名前・連絡先はうかがいません。</p>
      </aside>
    </main>

    <footer>© 2026 <a href="https://hari-hari.jimdofree.com/" target="_blank" rel="noreferrer">（一社）長野県針灸師会</a></footer>
    <script src="survey.js?v=20261015-4"></script>
  </body>
</html>
